# configuration for linters and project
[project]
name = "snowflake-data-transfer-to-aws-app"
version = "0.1"
requires-python = ">=3.14"
# transitive dependencies are pinned in uv.lock
dependencies = [
    "boto3>=1.43",
    "pandas>=2.3",
    "pyarrow>=26.0",
    "snowflake-connector-python[pandas]>=5.1",
    "snowflake-sqlalchemy>=2.0",
    "SQLAlchemy>=2.0.55",
]

# split by CI job so lint/format only install ruff; `uv sync` installs all of dev
[dependency-groups]
lint = ["ruff>=0.17"]
typecheck = ["mypy>=2.4", "pandas-stubs", "boto3-stubs[s3]"]
test = ["pytest>=9.1", "moto[s3]>=5.2"]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
]

[tool.uv]
# floors from previous security bumps; applied only if something depends on them
constraint-dependencies = [
    "cryptography>=50.0.0",
    "pyOpenSSL>=26.4.0",
    "requests>=2.33.0",
    "urllib3>=2.8.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["main.py", "snowflake_service.py", "write_to_parquet.py", "tests"]

# snowflake.sqlalchemy builds __all__ from concatenated tuples, which mypy can't follow
[[tool.mypy.overrides]]
module = ["snowflake.sqlalchemy"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.parquet"]
ignore_missing_imports = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]
