name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job installs uv with setup-uv; uv then installs the Python version
# pinned in .python-version. --locked fails the job if uv.lock is out of date
# with pyproject.toml. Each job syncs only the dependency group it needs.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-suffix: test
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Run pytest
        run: uv run --no-sync pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-suffix: lint
      - name: Install dependencies
        run: uv sync --locked --only-group lint
      - name: Run ruff check
        run: uv run --no-sync ruff check --output-format=github .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-suffix: typecheck
      - name: Install dependencies
        # tests are type checked too, so they need the test group
        run: uv sync --locked --no-default-groups --group typecheck --group test
      - name: Run mypy
        run: uv run --no-sync mypy

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-suffix: format
      - name: Install dependencies
        run: uv sync --locked --only-group lint
      - name: Run ruff format
        run: uv run --no-sync ruff format --check --diff .
